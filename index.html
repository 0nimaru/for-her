<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#f3dcd4" />
  <title>A Little Something For You</title>
  <meta name="description" content="A few postcards, just for you." />
  <meta property="og:title" content="A little something for you 💌" />
  <meta property="og:description" content="Open me, I promise it's cute." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="diary.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="For You" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <!-- Shared flower artwork -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="gPetal" cx="50%" cy="85%" r="85%">
        <stop offset="0" stop-color="#c9756c" />
        <stop offset=".45" stop-color="#e7a59c" />
        <stop offset="1" stop-color="#fbe0d9" />
      </radialGradient>
      <radialGradient id="gPetalCream" cx="50%" cy="85%" r="85%">
        <stop offset="0" stop-color="#e2b49f" />
        <stop offset=".5" stop-color="#f7ddd0" />
        <stop offset="1" stop-color="#fffaf4" />
      </radialGradient>
      <radialGradient id="gCenter" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fff1c7" />
        <stop offset=".6" stop-color="#e5b56a" />
        <stop offset="1" stop-color="#b9823e" />
      </radialGradient>
      <radialGradient id="gRose" cx="42%" cy="38%" r="70%">
        <stop offset="0" stop-color="#f8cfc8" />
        <stop offset=".55" stop-color="#e09a92" />
        <stop offset="1" stop-color="#b9675f" />
      </radialGradient>
      <radialGradient id="gRoseIn" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#eaa29a" />
        <stop offset="1" stop-color="#b65e57" />
      </radialGradient>
      <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f8dc9a" />
        <stop offset=".5" stop-color="#d9a84f" />
        <stop offset="1" stop-color="#b07a2e" />
      </linearGradient>
      <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#c3d4b4" />
        <stop offset="1" stop-color="#7f9a72" />
      </linearGradient>

      <g id="petal">
        <path d="M0,0 C-20,-10 -22,-38 0,-47 C22,-38 20,-10 0,0Z" />
      </g>

      <symbol id="bloom" viewBox="-50 -50 100 100">
        <g fill="url(#gPetal)" stroke="#c07e74" stroke-width="1.2">
          <use href="#petal" />
          <use href="#petal" transform="rotate(72)" />
          <use href="#petal" transform="rotate(144)" />
          <use href="#petal" transform="rotate(216)" />
          <use href="#petal" transform="rotate(288)" />
        </g>
        <g stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M0,-12 L0,-34" /><path d="M0,-12 L0,-34" transform="rotate(72)" /><path d="M0,-12 L0,-34" transform="rotate(144)" /><path d="M0,-12 L0,-34" transform="rotate(216)" /><path d="M0,-12 L0,-34" transform="rotate(288)" />
        </g>
        <circle r="11" fill="url(#gCenter)" />
        <g fill="#a46c33"><circle cx="-4" cy="-3" r="1.4" /><circle cx="3" cy="-4" r="1.4" /><circle cx="4" cy="3" r="1.4" /><circle cx="-3" cy="4" r="1.4" /><circle cx="0" cy="0" r="1.4" /></g>
      </symbol>

      <symbol id="blossom" viewBox="-50 -50 100 100">
        <g fill="url(#gPetalCream)" stroke="#d6a594" stroke-width="1.2">
          <use href="#petal" transform="rotate(36)" />
          <use href="#petal" transform="rotate(108)" />
          <use href="#petal" transform="rotate(180)" />
          <use href="#petal" transform="rotate(252)" />
          <use href="#petal" transform="rotate(324)" />
        </g>
        <circle r="10" fill="url(#gCenter)" />
      </symbol>

      <symbol id="rose" viewBox="-50 -50 100 100">
        <g fill="url(#gRose)" stroke="#b16a62" stroke-width="1.3">
          <g id="rpetal"><path d="M0,0 C-30,-4 -36,-44 0,-47 C36,-44 30,-4 0,0Z" /></g>
          <use href="#rpetal" transform="rotate(72)" /><use href="#rpetal" transform="rotate(144)" /><use href="#rpetal" transform="rotate(216)" /><use href="#rpetal" transform="rotate(288)" />
        </g>
        <g fill="#e6a49b" stroke="#a9554e" stroke-width="1.2">
          <use href="#rpetal" transform="rotate(36) scale(.66)" /><use href="#rpetal" transform="rotate(108) scale(.66)" /><use href="#rpetal" transform="rotate(180) scale(.66)" /><use href="#rpetal" transform="rotate(252) scale(.66)" /><use href="#rpetal" transform="rotate(324) scale(.66)" />
        </g>
        <circle r="15" fill="url(#gRoseIn)" stroke="#9c4d47" stroke-width="1.2" />
        <path d="M-2,2 a4,4 0 1,1 6,-3 a8,8 0 1,1 -13,5 a12,12 0 0,1 18,-12" fill="none" stroke="#8e423d" stroke-width="2.4" stroke-linecap="round" />
        <path d="M-26,-26 a34,34 0 0,1 20,-12" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" />
      </symbol>

      <symbol id="corner" viewBox="0 0 60 60">
        <g fill="none" stroke="url(#gGold)" stroke-linecap="round">
          <path d="M4,56 L4,22 Q4,4 22,4 L56,4" stroke-width="2.6" />
          <path d="M11,50 Q11,11 50,11" stroke-width="1.6" />
          <path d="M18,18 q8,-2 9,6 q-6,4 -9,-6z" stroke-width="1.4" />
          <path d="M4,56 q8,-6 3,-12 M56,4 q-6,8 -12,3" stroke-width="1.6" />
        </g>
        <circle cx="22" cy="22" r="2.4" fill="url(#gGold)" />
      </symbol>

      <symbol id="leaf" viewBox="-50 -50 100 100">
        <path d="M0,46 C-26,20 -22,-26 0,-46 C22,-26 26,20 0,46Z" fill="url(#gLeaf)" stroke="#6f8a63" stroke-width="1.6" />
        <path d="M0,40 L0,-38 M0,10 L-12,-4 M0,-8 L12,-22 M0,24 L12,10" stroke="#eef3e6" stroke-opacity=".75" stroke-width="2" fill="none" stroke-linecap="round" />
      </symbol>
    </defs>
  </svg>

  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="stage">
    <header class="top">
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <button class="diary-btn" id="diaryBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5" fill="#e7a99f" stroke="#a9645a" stroke-width="1.4"/><rect x="4" y="2.5" width="3.5" height="19" rx="1.5" fill="#c98379"/><path d="M14 9.2c-1.3-1.6-3.8-.6-3.3 1.3.4 1.4 3.3 3.2 3.3 3.2s2.9-1.8 3.3-3.2c.5-1.9-2-2.9-3.3-1.3z" fill="#fff6f2"/></svg>
        diary
      </button>
      <button class="restart" id="restart" type="button" aria-label="Start over">↺</button>
    </header>

    <section class="card-area">
      <div class="tilt" id="tilt">
        <div class="stack s2" aria-hidden="true"></div>
        <div class="stack s1" aria-hidden="true"></div>
        <article class="card" id="card">
          <div class="paper"></div>
          <div class="garland" id="garland" aria-hidden="true"></div>
          <div class="content" id="content" aria-live="polite"></div>
        </article>
      </div>
    </section>

    <aside class="buddy" aria-hidden="true">
      <svg id="hyena" class="hyena" viewBox="0 0 140 126" data-mood="neutral">
        <g class="hy-bob">
          <!-- body -->
          <path d="M36,126 C36,101 50,92 70,92 C90,92 104,101 104,126Z" fill="#d8b38b" stroke="#7a5a42" stroke-width="2" />
          <circle cx="58" cy="106" r="3.5" fill="#9c7552" /><circle cx="84" cy="104" r="4" fill="#9c7552" /><circle cx="76" cy="114" r="3" fill="#9c7552" /><circle cx="64" cy="118" r="2.5" fill="#9c7552" />

          <g class="hy-head">
            <!-- ears -->
            <g class="ear ear-l">
              <ellipse cx="36" cy="32" rx="14" ry="19" transform="rotate(-22 36 32)" fill="#cfa47c" stroke="#7a5a42" stroke-width="2" />
              <ellipse cx="37.5" cy="34" rx="7.5" ry="11.5" transform="rotate(-22 37.5 34)" fill="#eeb1a6" />
            </g>
            <g class="ear ear-r">
              <ellipse cx="104" cy="32" rx="14" ry="19" transform="rotate(22 104 32)" fill="#cfa47c" stroke="#7a5a42" stroke-width="2" />
              <ellipse cx="102.5" cy="34" rx="7.5" ry="11.5" transform="rotate(22 102.5 34)" fill="#eeb1a6" />
            </g>
            <!-- mane tuft -->
            <path d="M56,31 L57,14 L63,24 L66,7 L71,22 L75,6 L78,22 L84,12 L85,31Z" fill="#5e4130" />
            <!-- head -->
            <ellipse cx="70" cy="60" rx="40" ry="35" fill="#dfbd95" stroke="#7a5a42" stroke-width="2" />
            <g fill="#9c7552">
              <circle cx="39" cy="51" r="4" /><circle cx="47" cy="41" r="3" /><circle cx="35" cy="63" r="3" /><circle cx="42" cy="61" r="2" />
              <circle cx="101" cy="51" r="4" /><circle cx="93" cy="41" r="3" /><circle cx="105" cy="63" r="3" /><circle cx="98" cy="61" r="2" />
              <circle cx="62" cy="36" r="2" /><circle cx="78" cy="36" r="2" />
            </g>
            <!-- muzzle -->
            <ellipse cx="70" cy="81" rx="21" ry="15" fill="#7d5f4b" />
            <ellipse cx="70" cy="84" rx="13" ry="8" fill="#9a7b65" opacity=".55" />
            <ellipse cx="54" cy="59" rx="9" ry="7.5" fill="#c9a37c" opacity=".7" /><ellipse cx="86" cy="59" rx="9" ry="7.5" fill="#c9a37c" opacity=".7" />
            <path d="M62.5,70 q7.5,-4.5 15,0 q-2,7.5 -7.5,8.5 q-5.5,-1 -7.5,-8.5z" fill="#3b2a20" />
            <ellipse cx="67" cy="70.6" rx="2.2" ry="1.1" fill="#fff" opacity=".6" />
            <path d="M70,78 v4" stroke="#3b2a20" stroke-width="2" stroke-linecap="round" />
            <!-- blush -->
            <ellipse class="blush" cx="44" cy="73" rx="7" ry="4" fill="#f29a95" />
            <ellipse class="blush" cx="96" cy="73" rx="7" ry="4" fill="#f29a95" />

            <g stroke="#2d1f18" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <!-- neutral -->
              <g class="face f-neutral">
                <circle cx="54" cy="58" r="4.6" fill="#2d1f18" stroke="none" /><circle cx="55.6" cy="56.4" r="1.5" fill="#fff" stroke="none" />
                <circle cx="86" cy="58" r="4.6" fill="#2d1f18" stroke="none" /><circle cx="87.6" cy="56.4" r="1.5" fill="#fff" stroke="none" />
                <path d="M62,83 q4,4 8,-1 q4,5 8,1" fill="none" />
              </g>
              <!-- happy -->
              <g class="face f-happy">
                <path d="M49,60 q5,-7 10,0" fill="none" stroke-width="3" />
                <path d="M81,60 q5,-7 10,0" fill="none" stroke-width="3" />
                <path d="M61,83 q9,12 18,0 z" fill="#5b2b2b" />
                <path d="M65.5,88.5 q4.5,3.5 9,0 q-4.5,-3 -9,0" fill="#ef8f95" stroke="none" />
              </g>
              <!-- laugh -->
              <g class="face f-laugh">
                <path d="M49,54 l9,4.5 l-9,4.5" fill="none" stroke-width="3" />
                <path d="M91,54 l-9,4.5 l9,4.5" fill="none" stroke-width="3" />
                <path d="M58,82 q12,18 24,0 z" fill="#5b2b2b" />
                <path d="M64,90 q6,5 12,0 q-6,-4 -12,0" fill="#ef8f95" stroke="none" />
                <path d="M61,82.5 l2.5,3 l2.5,-3 M74,82.5 l2.5,3 l2.5,-3" fill="#fff" stroke="none" />
              </g>
              <!-- sad -->
              <g class="face f-sad">
                <circle cx="54" cy="59" r="4" fill="#2d1f18" stroke="none" /><circle cx="55.3" cy="57.6" r="1.3" fill="#fff" stroke="none" />
                <circle cx="86" cy="59" r="4" fill="#2d1f18" stroke="none" /><circle cx="87.3" cy="57.6" r="1.3" fill="#fff" stroke="none" />
                <path d="M47,52 L59,47.5" fill="none" /><path d="M81,47.5 L93,52" fill="none" />
                <path d="M62,90 q8,-7 16,0" fill="none" />
                <path class="tear" d="M50,65 q-3.5,5.5 0,7.5 q3.5,-2 0,-7.5z" fill="#9fd0f0" stroke="none" />
              </g>
              <!-- love -->
              <g class="face f-love">
                <path d="M54,64 C43,56 47,48 54,53.5 C61,48 65,56 54,64Z" fill="#e0566b" stroke="none" />
                <path d="M86,64 C75,56 79,48 86,53.5 C93,48 97,56 86,64Z" fill="#e0566b" stroke="none" />
                <path d="M61,83 q9,12 18,0 z" fill="#5b2b2b" />
                <path d="M65.5,88.5 q4.5,3.5 9,0 q-4.5,-3 -9,0" fill="#ef8f95" stroke="none" />
              </g>
              <!-- shy -->
              <g class="face f-shy">
                <path d="M49,57 q5,5 10,0" fill="none" />
                <path d="M81,57 q5,5 10,0" fill="none" />
                <path d="M63,86 q2.3,-2 4.6,0 q2.3,2 4.6,0 q2.3,-2 4.6,0" fill="none" stroke-width="2" />
              </g>
              <!-- smug -->
              <g class="face f-smug">
                <path d="M49.5,58 a4.5,4.5 0 0 0 9,0z" fill="#2d1f18" stroke="none" />
                <path d="M81.5,58 a4.5,4.5 0 0 0 9,0z" fill="#2d1f18" stroke="none" />
                <path d="M48,57.5 h12 M80,57.5 h12" fill="none" />
                <path d="M63,85 q8,4 15,-3" fill="none" />
              </g>
              <!-- surprised -->
              <g class="face f-surprised">
                <circle cx="54" cy="57" r="6.2" fill="#fff" stroke-width="2" /><circle cx="54" cy="57.5" r="3.2" fill="#2d1f18" stroke="none" />
                <circle cx="86" cy="57" r="6.2" fill="#fff" stroke-width="2" /><circle cx="86" cy="57.5" r="3.2" fill="#2d1f18" stroke="none" />
                <ellipse cx="70" cy="87.5" rx="3.6" ry="4.6" fill="#5b2b2b" stroke="none" />
              </g>
              <!-- wink -->
              <g class="face f-wink">
                <circle cx="54" cy="58" r="4.6" fill="#2d1f18" stroke="none" /><circle cx="55.6" cy="56.4" r="1.5" fill="#fff" stroke="none" />
                <path d="M81,59 q5,-6 10,0" fill="none" stroke-width="3" />
                <path d="M62,84 q8,6 16,0" fill="none" />
                <path d="M71,86.5 q2,7 7,2 q-1,-3 -2,-3" fill="#ef8f95" stroke="#c46a72" stroke-width="1.2" />
              </g>
            </g>
          </g>

          <!-- paws -->
          <g fill="#dfbd95" stroke="#7a5a42" stroke-width="2">
            <ellipse cx="46" cy="118" rx="13" ry="8" />
            <ellipse cx="94" cy="118" rx="13" ry="8" />
          </g>
          <path d="M42,113 v5 M48,113 v5 M90,113 v5 M96,113 v5" stroke="#7a5a42" stroke-width="1.5" stroke-linecap="round" />
        </g>
      </svg>
      <div class="bubble" id="bubble"></div>
    </aside>
  </main>

  <!-- ================= Diary ================= -->
  <div class="diary-stage" id="diary" hidden>
    <div class="d-petals" id="dPetals" aria-hidden="true"></div>
    <div class="d-scaler" id="dScaler">
      <div class="d-top">
        <button class="d-back" id="dBack" type="button">‹ postcards</button>
        <span class="d-status" id="dStatus" aria-live="polite"></span>
      </div>

      <div class="d-tabs" id="dTabs" aria-label="Diary dates"></div>

      <div class="d-book" id="dBook">
        <div class="d-backcover"></div>

        <div class="d-page" id="dPage">
          <div class="washi" aria-hidden="true"></div>
          <div class="p-head"><span class="p-date" id="pDate"></span><span class="p-year" id="pYear"></span></div>
          <svg class="p-doodle" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#leaf" x="-30" y="-10" width="60" height="60" transform="rotate(-40)" /><use href="#bloom" x="-40" y="-50" width="80" height="80" /></svg>
          <svg class="p-doodle small" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#blossom" x="-50" y="-50" width="100" height="100" /></svg>
          <div class="p-lines" aria-hidden="true"></div>
          <textarea class="ink" id="ink" spellcheck="false" autocapitalize="sentences" placeholder="Dear diary, today…" aria-label="Diary page"></textarea>
          <textarea class="ink measure" id="inkMeasure" tabindex="-1" aria-hidden="true"></textarea>
          <div class="p-sent" id="pSent" aria-hidden="true">sent to<br />Andi ♡</div>
          <div class="p-foot">
            <div class="p-nav">
              <button type="button" id="pPrev" aria-label="Previous page">‹</button>
              <span id="pNum">1 / 1</span>
              <button type="button" id="pNext" aria-label="Next page">›</button>
            </div>
            <button type="button" class="p-share" id="pShare"><span class="tick">✓</span><span class="lbl">share</span></button>
          </div>
          <div class="p-curl" aria-hidden="true"></div>
        </div>

        <div class="d-cover" id="dCover" role="button" tabindex="0" aria-label="Open the diary">
          <div class="c-front">
            <div class="c-stitch"></div>
            <svg class="c-corner tl" viewBox="0 0 60 60"><use href="#corner" width="60" height="60" /></svg>
            <svg class="c-corner tr" viewBox="0 0 60 60"><use href="#corner" width="60" height="60" /></svg>
            <svg class="c-corner bl" viewBox="0 0 60 60"><use href="#corner" width="60" height="60" /></svg>
            <svg class="c-corner br" viewBox="0 0 60 60"><use href="#corner" width="60" height="60" /></svg>
            <div class="c-wreath" id="cWreath"></div>
            <div class="c-label">
              <span class="c-title">Dear Diary</span>
              <span class="c-name" id="cName"></span>
              <span class="c-sub">little secrets ♡</span>
            </div>
            <div class="c-year" id="cYear"></div>
          </div>
          <div class="c-back"></div>
        </div>
        <div class="d-strap" aria-hidden="true"><span class="clasp">♥</span></div>

        <svg class="d-scent" id="dScent" viewBox="-40 -160 368 670" aria-hidden="true">
          <defs>
            <linearGradient id="scentG" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#f4a9bb" stop-opacity=".95" />
              <stop offset=".6" stop-color="#f9cdd8" stop-opacity=".7" />
              <stop offset="1" stop-color="#fff0f4" stop-opacity="0" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <p class="d-hint" id="dHint">tap to open ♡</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="diary.js"></script>
</body>
</html>
